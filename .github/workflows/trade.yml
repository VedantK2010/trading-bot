name: Daily Trading Pipeline

on:
  # Runs weekdays at 4:35 PM ET — 35 min after the 4:00 PM market close,
  # giving closing prices time to settle and dodging GitHub's on-the-hour
  # cron congestion. GitHub Actions cron is UTC only and has no DST
  # awareness, so flip this line twice a year:
  #   EDT (roughly mid-Mar to early Nov): "35 20 * * 1-5"  <- currently active
  #   EST (roughly early Nov to mid-Mar): "35 21 * * 1-5"
  schedule:
    - cron: "35 20 * * 1-5"
  # Lets you trigger a manual test run from the Actions tab, no waiting for cron.
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p logs
          python master_pipeline.py 2>&1 | tee logs/run.log

      # Keeps the run's stdout/stderr even after the job finishes,
      # since headless runs have no terminal to read.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/
          retention-days: 30
